name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: DSH ${{ matrix.dsh }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        dsh:
          - 0.1.5-rc.2
          - 0.1.6-alpha.2
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install --omit=peer --ignore-scripts --no-package-lock
      - run: npm test
      - run: .github/scripts/prove-packed-install.sh "${{ matrix.dsh }}"

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Select release metadata
        id: release
        run: |
          version="${GITHUB_REF_NAME#v}"
          package_version="$(node -p "require('./package.json').version")"
          if [[ "$version" != "$package_version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $package_version" >&2
            exit 1
          fi
          dist_tag="${version#*-}"
          if [[ "$dist_tag" == "$version" ]]; then
            dist_tag=latest
            prerelease=false
          else
            dist_tag="${dist_tag%%.*}"
            prerelease=true
          fi
          {
            printf 'version=%s\n' "$version"
            printf 'dist_tag=%s\n' "$dist_tag"
            printf 'prerelease=%s\n' "$prerelease"
          } >> "$GITHUB_OUTPUT"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub release $GITHUB_REF_NAME already exists"
            exit 0
          fi
          notes="$(awk -v heading="## $RELEASE_VERSION" '
            $0 == heading || index($0, heading " ") == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md)"
          args=(release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$GITHUB_REF_NAME")
          if [[ "$PRERELEASE" == true ]]; then
            args+=(--prerelease)
          fi
          if [[ -n "$notes" ]]; then
            printf '%s\n' "$notes" > "$RUNNER_TEMP/release-notes.md"
            args+=(--notes-file "$RUNNER_TEMP/release-notes.md")
          else
            args+=(--generate-notes)
          fi
          gh "${args[@]}"
      - name: Publish @sessionbus/dsh
        env:
          NPM_DIST_TAG: ${{ steps.release.outputs.dist_tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          if npm view "@sessionbus/dsh@$RELEASE_VERSION" version >/dev/null 2>&1; then
            echo "@sessionbus/dsh@$RELEASE_VERSION already published"
          else
            npm publish --access public --provenance --tag "$NPM_DIST_TAG"
          fi
