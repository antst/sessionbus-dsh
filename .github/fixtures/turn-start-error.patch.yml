- id: llm-deepseek
  disabled: true

- id: session-title-llm
  disabled: true

- id: session-persistence-jsonl
  config:
    root: !!js process.env.DSH_W086_SESSION_ROOT
    compression: none

- insert:
    - id: llm-replay
      name: '@deepseek-ai/dsh-llm-replay'
      config:
        file: !!js process.env.DSH_SNAPSHOT_FILE
        paceMs: 0
        providers:
          - id: deepseek-official
            name: Replay
            models:
              - id: deepseek-v4-flash
                name: Recorded
                contextWindow: 100000

    - id: w086-turn-start-error
      name: '@sessionbus/w086-turn-start-error'
